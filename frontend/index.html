<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NapCat Desktop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23ff9f43'/%3E%3Cpath d='M6 9l1.5-3L9 8M18 9l-1.5-3L15 8M8 14c1 1 2 1.5 4 1.5s3-.5 4-1.5' stroke='%231a1208' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/views.css">
  <link rel="stylesheet" href="./styles/ai.css">
  <link rel="stylesheet" href="./styles/layout.css">
</head>
<body>
<!-- 自定义标题栏：纯 CSS -webkit-app-region 控制拖拽，按钮区 no-drag -->
<div class="titlebar">
  <div class="tb-left">
    <div class="tb-logo">
      <img src="logo.png" alt="">
    </div>
    <span class="tb-title">NapCat Desktop</span>
  </div>
  <div class="tb-right">
    <button class="tb-btn" id="btn-min" data-action="win-minimize" title="最小化">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 6h8"/></svg>
    </button>
    <button class="tb-btn" id="btn-max" data-action="win-max" title="最大化/还原">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="2" width="8" height="8" rx="0.5"/></svg>
    </button>
    <button class="tb-btn close" id="btn-close" data-action="win-close" title="关闭">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 2l8 8M10 2l-8 8"/></svg>
    </button>
  </div>
</div>
<div class="app">
  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <img src="logo.png" alt="DeepSeek">
      </div>
      <div>
        <div class="brand-name">NapCat Desktop</div>
        <div class="brand-sub">v0.1.0 · tauri</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-section">运行</div>
      <div class="nav-item" data-route="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        概览
      </div>
      <div class="nav-item" data-route="accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        账号管理
      </div>
      <div class="nav-item" data-route="network">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        OneBot 网络
      </div>
      <div class="nav-item" data-route="plugins">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        插件
      </div>
      <div class="nav-item" data-route="ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1H7a3 3 0 0 0-3 3v2H3a1 1 0 0 0 0 2h1v2a3 3 0 0 0 3 3h2v1a3 3 0 0 0 6 0v-1h2a3 3 0 0 0 3-3v-2h1a1 1 0 0 0 0-2h-1V9a3 3 0 0 0-3-3h-2V5a3 3 0 0 0-3-3z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/><path d="M9 15c1 .7 2 1 3 1s2-.3 3-1"/></svg>
        AI 接入
      </div>
      <div class="nav-item" data-route="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        实时日志
      </div>
      <div class="nav-section">界面</div>
      <div class="nav-item" data-route="webui">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        内嵌 WebUI
      </div>
      <div class="nav-item" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </div>
    </nav>
    <div class="sidebar-foot">
      <span class="dot off" id="tray-dot"></span>
      <span id="tray-text">NapCat 已停止</span>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">运行 / <b id="crumb-page">概览</b></div>
      <div class="top-actions">
        <button class="btn ghost sm" id="theme-btn" data-action="toggle-theme" title="切换浅色/深色主题"></button>
        <button class="btn ghost sm" data-action="check-update">检查更新</button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- 自定义模态弹窗（替代原生 prompt/confirm，风格与软件统一） -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-title" id="modal-title">输入</div>
    <input type="text" class="modal-input" id="modal-input" autocomplete="off">
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="qrcode-overlay">
  <div class="modal-card" style="max-width:340px;text-align:center">
    <div class="modal-title" style="justify-content:center">扫码登录 QQ</div>
    <div style="margin:14px 0">
      <img id="qrcode-img" style="width:260px;height:260px;border-radius:8px;background:#fff;padding:8px" alt="登录二维码">
    </div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:12px">打开手机 QQ → 右上角加号 → 扫一扫</div>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn primary" id="qrcode-close">关闭</button>
    </div>
  </div>
</div>

  <script src="./scripts/core/state.js"></script>
  <script src="./scripts/core/dom.js"></script>
  <script src="./scripts/ui/actions.js"></script>
  <script src="./scripts/views/views.js"></script>
  <script src="./scripts/views/ai.js"></script>
  <script src="./scripts/core/router.js"></script>
  <script src="./scripts/core/logs.js"></script>
  <script src="./scripts/ui/interactions.js"></script>
  <script src="./scripts/ui/ai-actions.js"></script>
  <script src="./scripts/core/ipc.js"></script>
  <script src="./scripts/main.js"></script>
</body>
</html>
