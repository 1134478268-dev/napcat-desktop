name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 项目只面向 Windows（Tauri + WebView2 + 注册表），用 windows runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 复用仓库里的 lint.ps1，保证本地与 CI 走同一条命令，
      # 避免「本地过了 CI 挂」这种两套规则的问题。
      # 它包含：clippy --all-targets -- -D warnings、cargo test、前端单测。
      - name: clippy + tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/lint.ps1

      # L2：依赖漏洞复核（本地难以核实 advisory，放到 CI 用官方数据库）。
      #
      # 不用 rustsec/audit-check：它固定在 Node 20，GitHub 已弃用，会挂一条
      # annotation 让 Actions 页面出现黄色标记。这里直接跑 cargo audit，输出完全可控。
      #
      # 忽略的两个 informational advisory（都不是本项目可利用的漏洞）：
      #   RUSTSEC-2024-0429  glib unsound —— glib 是 Linux/GTK 依赖，本项目只构建 Windows，
      #                      它因跨平台依赖解析出现在 Cargo.lock 里，不会编译进产物。
      #   RUSTSEC-2024-0370  proc-macro-error 停止维护 —— 间接依赖（经 tauri 构建链引入），
      #                      只有"不再维护"标记，无安全漏洞，无法在不 fork 依赖树的情况下移除。
      # 真正的 vulnerability 仍然会让这一步失败，被忽略的只有这两条 informational。
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370

  build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build.ps1
      # 构建产物不入库，仅作为「能打包」的证明；需要发布时再上传 artifact
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: napcat-desktop
          path: NapCatDesktop.exe
          if-no-files-found: error
