[package]
name = "napcat-desktop"
version = "0.4.2"
description = "NapCat Desktop 管理面板"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# 审计 M3：用 Windows DPAPI 加密落盘的 API Key / OneBot Token。
# ShellExecuteW 用于 open_external：绕开 cmd.exe 的二次解析（审计 H1 的长期建议）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
